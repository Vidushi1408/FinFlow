[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "0.1.0"
description = "FinFlow - Advanced Python Fraud and Finance Pipeline"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "psycopg2-binary>=2.9.7",
    "SQLAlchemy>=2.0.20",
    "python-dotenv>=1.0.0",
    "holidays>=0.33",
    "joblib>=1.3.2"
]

[tool.setuptools.packages.find]
include = ["data_generator", "database", "etl", "ml", "webapp"]

[tool.ruff]
line-length = 160
exclude = ["venv", ".venv", "models"]

[tool.ruff.lint]
# Correctness-focused baseline (pyflakes + pycodestyle errors), not style opinions.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a real PostgreSQL server (creates and drops a throwaway database); skipped automatically if none is reachable",
]

[tool.bandit]
# B311 (random.* "not cryptographically secure") is skipped repo-wide: `random` is used ONLY in
# synthetic/demo/benchmark data generation (data_generator/, scripts/stream_data.py,
# scripts/seed_demo.py, scripts/benchmark_endpoints.py, webapp/services/demo_seed.py,
# etl_pipeline.py) -- never for tokens, keys, or session ids. The real secret path
# (webapp/app.py:load_secret_key) uses secrets.token_hex, which bandit already accepts.
# Verified by grep audit before adding this skip; tests/test_requirements.py and the security
# tests in tests/test_flask.py guard the secret-key path specifically.
skips = ["B311"]
exclude_dirs = ["venv", ".venv", "tests", "models"]

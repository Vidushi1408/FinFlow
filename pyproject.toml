[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "0.1.0"
description = "FinFlow - Advanced Python Fraud and Finance Pipeline"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "psycopg2-binary>=2.9.7",
    "SQLAlchemy>=2.0.20",
    "python-dotenv>=1.0.0",
    "holidays>=0.33",
    "joblib>=1.3.2"
]

[tool.setuptools.packages.find]
include = ["data_generator", "database", "etl", "ml", "webapp"]

[tool.ruff]
line-length = 160
exclude = ["venv", ".venv", "models"]

[tool.ruff.lint]
# Correctness-focused baseline (pyflakes + pycodestyle errors), not style opinions.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a real PostgreSQL server (creates and drops a throwaway database); skipped automatically if none is reachable",
]

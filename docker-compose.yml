services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d finflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build: .
    command: python scripts/seed_demo.py
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=finflow
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  webapp:
    build: .
    # GUNICORN_WORKERS defaults to 1 (zero-config quick start, matching the README and CI's smoke
    # job). Set it in a .env next to this file to run more than one worker -- e.g. GUNICORN_WORKERS=4
    # -- and set a real SECRET_KEY alongside it: webapp/app.py refuses to start with more than one
    # worker and no real SECRET_KEY, because gunicorn forks each worker from a fresh import of the
    # app, so a random per-process key would mean every worker signs sessions differently and logins
    # would randomly fail depending on which worker handles the next request.
    command: gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-1} webapp.app:app
    ports:
      - "8000:8000"
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=finflow
      # Leave unset for a random per-start key (fine for one worker, but logins reset on restart).
      # For a stable key, set SECRET_KEY in a .env next to this file. Mandatory in production, and
      # mandatory the moment GUNICORN_WORKERS is set above 1 (see the comment on `command:` above).
      - SECRET_KEY=${SECRET_KEY:-}
      - FLASK_ENV=${FLASK_ENV:-development}
      # Must match the --workers flag on `command:` above -- gunicorn has no standard way to tell the
      # app how many sibling workers exist, so webapp/app.py reads this instead. Keep them in sync;
      # both read the same GUNICORN_WORKERS variable, so setting it once in a .env keeps them in sync
      # automatically.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      # Shares login-rate-limit counters across workers/containers; without it each worker counts
      # separately, so N workers give N times the intended limit. Becomes load-bearing the moment
      # GUNICORN_WORKERS is set above 1.
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    healthcheck:
      # the slim image has no curl; /health returns 503 (=> urlopen raises) when the DB is unreachable
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - .:/app

volumes:
  pgdata:
